# Presubmit gate for the Python tooling and CI action wiring under .github:
# the unit tests are stdlib-only and use the `*_test.py` suffix, so select
# that pattern explicitly because it is not unittest discover's default.
name: CI Scripts Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/dependabot.yml'
      - '**/go.mod'
      - '**/package.json'
      - '**/requirements*.txt'
      - '**/setup.py'
      - '**/pyproject.toml'
      - '**/action.yml'
      - '**/action.yaml'
      - '.pre-commit-config.yaml'
      - '.github/actions/create-cluster/**'
      - '.github/actions/deploy/**'
      - '.github/actions/download-artifact-with-retry/**'
      - '.github/resources/curl-retry/**'
      - '.github/resources/buildkitd.toml'
      - '.github/resources/runtime-base-images.txt'
      - '.github/resources/scripts/*.py'
      - '.github/resources/scripts/*.js'
      - '.github/resources/ci-workflow-inventory.json'
      # Any trigger change must update the expected-workflow inventory.
      - '.github/workflows/**'
      # The observability shell scripts are covered by Python-driven tests.
      - '.github/resources/scripts/*.sh'
      - '.github/resources/scripts/kfp-readiness/**'
      - '.github/actions/junit-summary/**'
      - '.github/workflows/ci-checks.yml'
      - '.github/workflows/create-manifest.yml'
      - '.github/actions/upload-artifact-with-retry/**'
      - '.github/actions/test-and-report/**'
      - '.github/workflows/api-server-tests.yml'
      - '.github/workflows/create-manifest.yml'
      - '.github/workflows/e2e-test.yml'
      - '.github/workflows/e2e-test-frontend.yml'
      - '.github/workflows/image-builds.yml'
      - '.github/workflows/validate-generated-files.yml'
      - '.github/workflows/osv-scanner.yml'
      - '.github/workflows/build-tools-images.yml'
      - '.github/workflows/runtime-base-images.yml'
      - '.github/workflows/ci-scripts-tests.yml'
      - '.github/workflows/pre-commit.yml'
      - '.github/workflows/gh-workflow-approve.yml'
      - 'manifests/kustomize/third-party/argo/base/workflow-controller-configmap-patch.yaml'
      - 'manifests/kustomize/third-party/argo/base/workflow-controller-deployment-patch.yaml'
      - 'manifests/kustomize/third-party/argo/base/kustomization.yaml'
      - 'manifests/kustomize/third-party/argo/installs/**'
      - 'manifests/kustomize/third-party/mysql/base/mysql-deployment.yaml'
      - 'backend/Dockerfile'
      - 'backend/src/common/types.go'
      - 'go.mod'
      - 'go.sum'
      - 'test/install-argo-cli.sh'
      - 'third_party/argo/COMPATIBILITY_VERSION'
      - 'third_party/argo/Makefile'
      - 'third_party/argo/UPGRADE.md'
      - 'third_party/argo/VERSION'
      - 'test_data/sdk_compiled_pipelines/valid/critical/modelcar/Dockerfile'

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

jobs:
  python-script-tests:
    name: Run .github scripts unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Run Python script unit tests
        working-directory: .github/resources/scripts
        run: python3 -m unittest discover -v -p '*_test.py'
      - name: Run JUnit summary action unit tests
        working-directory: .github/actions/junit-summary
        run: python3 -m unittest discover -v -p '*_test.py'
      - name: Exercise verifier with live upstream API data (read only)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {verifyExpectedWorkflows, loadLocalInventory} = require('./.github/resources/scripts/ci_expected_workflows');
            const {freshAfter} = require('./.github/resources/scripts/ci_passed');
            const repo = {owner: 'kubeflow', repo: 'pipelines'};
            const {data: pullRequest} = await github.rest.pulls.get({...repo, pull_number: 14111});
            const result = await verifyExpectedWorkflows({github, ...repo, pullRequest,
              ...loadLocalInventory(process.env.GITHUB_WORKSPACE),
              freshAfter: await freshAfter(github, {repo}, pullRequest)});
            core.info(JSON.stringify({sha: pullRequest.head.sha, ...result}, null, 2));
            await core.summary.addHeading('Read-only live API verification')
              .addCodeBlock(JSON.stringify({sha: pullRequest.head.sha, ...result}, null, 2)).write();
